name: Release Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则自动使用 plugin.json 中的版本）'
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(node -p "require('./plugin.json').version")
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}"

      - name: Update version in manifests
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          node -e "
            const fs = require('fs');
            for (const f of ['plugin.json', 'package.json']) {
              const p = JSON.parse(fs.readFileSync(f, 'utf-8'));
              p.version = '${VERSION}';
              fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
            }
            const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf-8'));
            lock.version = '${VERSION}';
            lock.packages[''].version = '${VERSION}';
            fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          "

      - name: Build
        run: npm run build

      - name: Verify release package
        run: npm test && npm run validate

      - name: Extract plugin info
        id: plugin_info
        run: |
          ENTRY_PATH=$(node -p "require('./plugin.json').entryPath")
          ZIP_NAME="${ENTRY_PATH}.jsplugin.zip"
          echo "entryPath=${ENTRY_PATH}" >> $GITHUB_OUTPUT
          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release on this repo
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="${{ steps.plugin_info.outputs.zip_name }}"
          TAG="v${VERSION}"

          # Release 资产不可覆写；允许从“资产已创建、metadata 推送失败”的状态恢复。
          if gh release view "${TAG}" &>/dev/null; then
            echo "Release ${TAG} already exists; reusing immutable asset."
            if ! gh release view "${TAG}" --json assets --jq '.assets[].name' | grep -Fxq "${ZIP_NAME}"; then
              echo "::error::Release ${TAG} exists but asset ${ZIP_NAME} is missing."
              exit 1
            fi
          else
            gh release create "${TAG}" \
              "dist/${ZIP_NAME}" \
              --title "v${VERSION}" \
              --notes "自动构建的 JS 插件 v${VERSION}"
          fi

          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP_NAME}"
          echo "download_url=${DOWNLOAD_URL}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Synchronize release metadata on default branch
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DOWNLOAD_URL="${{ steps.create_release.outputs.download_url }}"
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('plugin.json', 'utf-8'));
            p.version = '${VERSION}';
            p.download_url = '${DOWNLOAD_URL}';
            fs.writeFileSync('plugin.json', JSON.stringify(p, null, 2) + '\n');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf-8'));
            pkg.version = '${VERSION}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf-8'));
            lock.version = '${VERSION}';
            lock.packages[''].version = '${VERSION}';
            fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugin.json package.json package-lock.json
          git diff --staged --quiet || git commit -m "chore(release): synchronize metadata for v${VERSION}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
